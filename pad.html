<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PS5 Pad Mastery — Training</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-[#0a0a14] text-[#e0e0e8] min-h-screen">
    <!-- ═══ HEADER ═══ -->
    <header class="border-b border-[rgba(255,255,255,0.08)] bg-[#111120] sticky top-0 z-50">
        <div class="max-w-[1400px] mx-auto px-4 py-2 flex items-center gap-4 flex-wrap">
            <a href="index.html" class="text-lg font-bold text-[#06b6d4] whitespace-nowrap flex items-center gap-2 no-underline">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
                PS5 Pad Mastery
            </a>
            <div class="flex items-center gap-2 ml-auto md:ml-4">
                <button id="btn-bpm-toggle" class="px-3 py-1.5 rounded-lg border border-[rgba(255,255,255,0.1)] bg-[#1a1a2e] text-[#6b7280] hover:border-[#06b6d4] hover:text-[#06b6d4] transition cursor-pointer text-xs font-semibold tracking-wide">♩ BPM</button>
                <div id="bpm-controls" style="display:none" class="flex items-center gap-2">
                    <button id="btn-bpm-down" class="w-8 h-8 rounded-lg border border-[rgba(255,255,255,0.1)] bg-[#1a1a2e] text-[#e0e0e8] hover:border-[#06b6d4] transition cursor-pointer font-bold text-lg flex items-center justify-center">−</button>
                    <div class="flex flex-col items-center min-w-[70px]">
                        <input id="bpm-slider" type="range" min="40" max="200" value="90" class="w-full h-1.5 bg-[rgba(255,255,255,0.1)] rounded-lg appearance-none cursor-pointer accent-[#06b6d4]" />
                        <span id="bpm-display" class="text-xl font-bold text-[#06b6d4] tabular-nums">90</span>
                        <span class="text-[10px] text-[#6b7280] uppercase tracking-wider">BPM</span>
                    </div>
                    <button id="btn-bpm-up" class="w-8 h-8 rounded-lg border border-[rgba(255,255,255,0.1)] bg-[#1a1a2e] text-[#e0e0e8] hover:border-[#06b6d4] transition cursor-pointer font-bold text-lg flex items-center justify-center">+</button>
                    <button id="btn-tap-tempo" class="px-3 py-1.5 rounded-lg border border-[rgba(255,255,255,0.1)] bg-[#1a1a2e] text-[#6b7280] hover:border-[#f59e0b] hover:text-[#f59e0b] transition cursor-pointer text-xs font-semibold tracking-wide">TAP</button>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-settings" class="w-9 h-9 rounded-lg border border-[rgba(255,255,255,0.1)] bg-[#1a1a2e] text-[#6b7280] hover:border-[#06b6d4] hover:text-[#06b6d4] transition cursor-pointer flex items-center justify-center">&#x2699;</button>
                <button id="btn-stats" class="w-9 h-9 rounded-lg border border-[rgba(255,255,255,0.1)] bg-[#1a1a2e] text-[#6b7280] hover:border-[#06b6d4] hover:text-[#06b6d4] transition cursor-pointer flex items-center justify-center">&#x1F4CA;</button>
            </div>
        </div>
        <div class="max-w-[1400px] mx-auto px-4 pb-2 flex items-center gap-4 text-xs text-[#6b7280]">
            <div class="flex items-center gap-1.5">
                <span id="status-dot" class="status-dot"></span>
                <span id="status-text">No controller</span>
            </div>
            <span id="controller-name" class="hidden md:inline"></span>
            <span class="hidden sm:inline">|</span>
            <span class="hidden sm:inline">Beat:</span>
            <span id="beat-dots" class="flex gap-1">
                <span class="beat-dot"></span><span class="beat-dot"></span><span class="beat-dot"></span><span class="beat-dot"></span>
            </span>
        </div>
    </header>

    <!-- ═══ SETTINGS PANEL ═══ -->
    <div id="settings-panel" class="hidden fixed right-0 top-0 h-full w-80 bg-[#111120] border-l border-[rgba(255,255,255,0.08)] z-[100] p-4 overflow-y-auto shadow-2xl">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-sm font-bold text-[#e0e0e8]">Settings</h3>
            <button onclick="document.getElementById('settings-panel').classList.add('hidden')" class="text-[#6b7280] hover:text-[#e0e0e8] cursor-pointer bg-none border-none text-lg">&times;</button>
        </div>
        <div class="space-y-4">
            <div><label class="text-xs text-[#6b7280] block mb-1">Volume</label><input type="range" data-setting="volume" min="0" max="1" step="0.05" value="0.5" class="w-full accent-[#06b6d4]" /></div>
            <div class="flex items-center justify-between"><label class="text-xs text-[#6b7280]">Show Hints</label><input type="checkbox" data-setting="showHints" checked class="accent-[#06b6d4] w-4 h-4" /></div>
            <div class="flex items-center justify-between"><label class="text-xs text-[#6b7280]">Strict Mode</label><input type="checkbox" data-setting="strictMode" class="accent-[#06b6d4] w-4 h-4" /></div>
            <div class="border-t border-[rgba(255,255,255,0.08)] pt-3">
                <div class="text-xs font-semibold text-[#e0e0e8] mb-2">Button Layout</div>
                <div class="flex gap-1 mb-1">
                    <button data-preset="standard" class="layout-preset-btn flex-1 py-1 text-xs rounded-lg border cursor-pointer transition">Standard</button>
                    <button data-preset="alt" class="layout-preset-btn flex-1 py-1 text-xs rounded-lg border cursor-pointer transition">Alternate</button>
                    <button data-preset="custom" class="layout-preset-btn flex-1 py-1 text-xs rounded-lg border cursor-pointer transition">Custom</button>
                </div>
                <div id="layout-desc" class="text-[10px] text-[#6b7280] mb-2"></div>
                <div id="input-map-grid" style="display:none" class="space-y-1.5"></div>
            </div>
        </div>
    </div>

    <!-- ═══ STATS PANEL ═══ -->
    <div id="stats-panel" class="hidden fixed right-0 top-0 h-full w-80 bg-[#111120] border-l border-[rgba(255,255,255,0.08)] z-[100] overflow-y-auto shadow-2xl">
        <div class="flex items-center justify-between p-4 border-b border-[rgba(255,255,255,0.08)]">
            <h3 class="text-sm font-bold text-[#e0e0e8]">Stats</h3>
            <button onclick="document.getElementById('stats-panel').classList.add('hidden')" class="text-[#6b7280] hover:text-[#e0e0e8] cursor-pointer bg-none border-none text-lg">&times;</button>
        </div>
        <div id="stats-content"></div>
    </div>

    <!-- ═══ MAIN LAYOUT ═══ -->
    <main class="max-w-[1400px] mx-auto p-4">
        <div class="flex flex-col lg:flex-row gap-4">
            <!-- LEFT: Skills / Reaction / Coordination -->
            <div class="w-full lg:w-72 xl:w-80 flex-shrink-0 flex flex-col gap-2">
                <!-- Tabs -->
                <div class="flex gap-1">
                    <button id="tab-skills" class="flex-1 py-1.5 px-2 rounded-lg text-xs font-semibold border cursor-pointer transition" style="background:#06b6d4;color:#000;border-color:#06b6d4" data-tab="skills">Skills</button>
                    <button id="tab-reaction" class="flex-1 py-1.5 px-2 rounded-lg text-xs font-semibold border border-[rgba(255,255,255,0.08)] bg-[#1a1a2e] text-[#6b7280] cursor-pointer transition hover:border-[#06b6d4] hover:text-[#06b6d4]" data-tab="reaction">Reaction</button>
                    <button id="tab-coord" class="flex-1 py-1.5 px-2 rounded-lg text-xs font-semibold border border-[rgba(255,255,255,0.08)] bg-[#1a1a2e] text-[#6b7280] cursor-pointer transition hover:border-[#10b981] hover:text-[#10b981]" data-tab="coord">Coordination</button>
                </div>
                <!-- Library panel (Skills tab) -->
                <div id="library-panel">
                    <!-- View switcher: Moves / Sequences / Drills -->
                    <div class="flex gap-1 mb-2">
                        <button class="lib-view-btn flex-1 py-1 text-xs rounded-lg border cursor-pointer transition" data-view="moves" style="background:#06b6d4;color:#000;border-color:#06b6d4">Moves</button>
                        <button class="lib-view-btn flex-1 py-1 text-xs rounded-lg border border-[rgba(255,255,255,0.08)] text-[#6b7280] cursor-pointer transition hover:border-[#3b82f6] hover:text-[#3b82f6]" data-view="sequences">Sequences</button>
                        <button class="lib-view-btn flex-1 py-1 text-xs rounded-lg border border-[rgba(255,255,255,0.08)] text-[#6b7280] cursor-pointer transition hover:border-[#10b981] hover:text-[#10b981]" data-view="drills">Drills</button>
                    </div>
                    <div id="moves-filters" class="mb-3 space-y-2">
                        <input id="search-moves" type="text" placeholder="Search moves..." class="w-full px-3 py-2 bg-[#1a1a2e] border border-[rgba(255,255,255,0.08)] rounded-lg text-sm text-[#e0e0e8] placeholder-[#6b7280] outline-none focus:border-[#3b82f6] transition" />
                        <div class="flex gap-1.5">
                            <select id="filter-category" class="flex-1 px-2 py-1.5 bg-[#1a1a2e] border border-[rgba(255,255,255,0.08)] rounded-lg text-xs text-[#e0e0e8] outline-none focus:border-[#3b82f6] cursor-pointer"></select>
                        </div>
                        <div class="flex gap-1 flex-wrap">
                            <button class="star-filter-btn px-2 py-1 rounded-md text-xs border border-[rgba(255,255,255,0.08)] bg-[#1a1a2e] text-[#6b7280] hover:border-[#f59e0b] hover:text-[#f59e0b] transition cursor-pointer" data-star="1">★1</button>
                            <button class="star-filter-btn px-2 py-1 rounded-md text-xs border border-[rgba(255,255,255,0.08)] bg-[#1a1a2e] text-[#6b7280] hover:border-[#f59e0b] hover:text-[#f59e0b] transition cursor-pointer" data-star="2">★2</button>
                            <button class="star-filter-btn px-2 py-1 rounded-md text-xs border border-[rgba(255,255,255,0.08)] bg-[#1a1a2e] text-[#6b7280] hover:border-[#f59e0b] hover:text-[#f59e0b] transition cursor-pointer" data-star="3">★3</button>
                            <button class="star-filter-btn px-2 py-1 rounded-md text-xs border border-[rgba(255,255,255,0.08)] bg-[#1a1a2e] text-[#6b7280] hover:border-[#f59e0b] hover:text-[#f59e0b] transition cursor-pointer" data-star="4">★4</button>
                            <button class="star-filter-btn px-2 py-1 rounded-md text-xs border border-[rgba(255,255,255,0.08)] bg-[#1a1a2e] text-[#6b7280] hover:border-[#f59e0b] hover:text-[#f59e0b] transition cursor-pointer" data-star="5">★5</button>
                        </div>
                    </div>
                    <div id="library-grid" class="space-y-2 max-h-[calc(100vh-370px)] overflow-y-auto pr-1"></div>
                </div>
                <!-- Training panel (Reaction / Coordination tabs) -->
                <div id="training-panel" style="display:none;max-height:calc(100vh - 200px)" class="bg-[#111120] border border-[rgba(255,255,255,0.08)] rounded-xl p-4 overflow-y-auto"></div>
            </div>

            <!-- CENTER: Virtual Controller -->
            <div class="flex-1 flex flex-col items-center justify-start min-w-0">
                <div class="pad-wrap">
                    <div id="trigger-l2" class="trigger-indicator">L2</div>
                    <div id="trigger-r2" class="trigger-indicator">R2</div>
