<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DualSense Controller Test</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            :root {
                --bg: #0a0a14;
                --accent: #3b82f6;
                --accent-glow: #60a5fa;
                --pressed: #06b6d4;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                background: var(--bg);
                color: #e0e0e8;
                font-family: "Inter", system-ui, sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 1rem;
                -webkit-font-smoothing: antialiased;
            }

            /* ── SVG container ── */
            .pad-wrap {
                position: relative;
                width: 100%;
                max-width: 640px;
                margin: 0 auto;
                padding-top: 22px;
            }
            .pad-wrap svg {
                width: 100%;
                height: auto;
                display: block;
            }

            /* ── Pad outline — thin, subtle ── */
            #AG-OUTLINE path {
                stroke: rgba(255, 255, 255, 0.06) !important;
                stroke-width: 0.8 !important;
            }

            /* ── Button stroke default ── */
            #pad-svg g[data-btn] {
                pointer-events: auto;
                cursor: pointer;
            }
            #pad-svg g[data-btn] path,
            #pad-svg g[data-btn] circle {
                stroke: rgba(255, 255, 255, 0.1);
                stroke-width: 0.8;
                transition:
                    stroke 80ms ease,
                    filter 80ms ease,
                    fill 80ms ease;
            }

            /* ── Pressed state ── */
            #pad-svg g[data-btn].pressed path,
            #pad-svg g[data-btn].pressed circle {
                stroke: var(--pressed) !important;
                stroke-width: 2 !important;
                fill: rgba(6, 182, 212, 0.18) !important;
                filter: drop-shadow(0 0 12px var(--pressed));
            }

            /* ── L2/R2 trigger indicators ── */
            .trigger-indicator {
                position: absolute;
                top: 0;
                width: 52px;
                height: 18px;
                border-radius: 4px;
                border: 1px solid rgba(255, 255, 255, 0.08);
                background: rgba(255, 255, 255, 0.02);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 9px;
                font-weight: 700;
                color: rgba(255, 255, 255, 0.25);
                font-family: "SF Mono", "Inter", monospace;
                letter-spacing: 0.05em;
                transition:
                    background 60ms ease,
                    border-color 60ms ease,
                    box-shadow 60ms ease,
                    color 60ms ease;
                pointer-events: none;
                z-index: 5;
            }
            .trigger-indicator.active {
                border-color: var(--pressed);
                background: rgba(6, 182, 212, 0.2);
                color: var(--pressed);
                box-shadow: 0 0 14px rgba(6, 182, 212, 0.5);
            }
            #trigger-l2 {
                left: 8%;
            }
            #trigger-r2 {
                right: 8%;
            }

            /* ── Touchpad always-on when connected ── */
            #TOUCHPAD.connected path {
                stroke: rgba(255, 255, 255, 0.18) !important;
                stroke-width: 1 !important;
                transition:
                    stroke 400ms ease,
                    stroke-width 400ms ease;
            }

            /* ── Stick knob movement ── */
            .stick-knob {
                transition: transform 50ms linear;
            }

            /* ── Lightbar glow ── */
            #LIGHTBAR {
                transition: fill 150ms ease;
            }

            /* ── Status bar ── */
            .status-bar {
                display: flex;
                gap: 1rem;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                margin-bottom: 1rem;
                font-size: 0.85rem;
            }
            .status-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #ef4444;
                box-shadow: 0 0 8px #ef4444;
                transition: background 300ms;
            }
            .status-dot.connected {
                background: #10b981;
                box-shadow: 0 0 12px #10b981;
            }

            /* ── Press log ── */
            .press-log {
                display: flex;
                gap: 0.4rem;
                flex-wrap: wrap;
                justify-content: center;
                min-height: 2rem;
                margin-top: 1rem;
            }
            .press-tag {
                padding: 0.25rem 0.6rem;
                border-radius: 6px;
                font-size: 0.75rem;
                font-weight: 700;
                font-family: "SF Mono", monospace;
                background: rgba(6, 182, 212, 0.15);
                color: var(--pressed);
                border: 1px solid rgba(6, 182, 212, 0.3);
                animation: tagIn 150ms ease;
            }
            @keyframes tagIn {
                from {
                    transform: scale(0.7);
                    opacity: 0;
                }
                to {
                    transform: scale(1);
                    opacity: 1;
                }
            }

            /* ── Keyboard hint ── */
            .kb-hint {
                font-size: 0.7rem;
                color: #555;
                text-align: center;
                margin-top: 0.5rem;
            }
        </style>
    </head>

        <!-- Active button tags -->
        <div class="press-log" id="press-log">
            <span style="color: #444; font-size: 0.8rem"
                >Press buttons on the controller or keyboard...</span
            >
        </div>

        <!-- Keyboard hints -->
        <div class="kb-hint">
            Keyboard: WASD = D-Pad &nbsp;|&nbsp; IJKL = △□✕◯ &nbsp;|&nbsp; Q/E =
            L1/R1 &nbsp;|&nbsp; 1/2 = L2/R2 &nbsp;|&nbsp; Arrows = Sticks
        </div>

        <script>
            /* ═══════════════════════════════════════
       Gamepad → SVG button mapping
       Standard DualSense Gamepad API indices
       ═══════════════════════════════════════ */
            const GAMEPAD_MAP = {
                0: "✕", // Cross
                1: "◯", // Circle
                2: "□", // Square
                3: "△", // Triangle
                4: "L1",
                5: "R1",
                6: "L2",
                7: "R2",
                8: "Create",
                9: "Options",
                10: "L3",
                11: "R3",
                12: "D-Up",
                13: "D-Down",
                14: "D-Left",
                15: "D-Right",
                16: "PS",
            };

            // Axes: 0=LS-X, 1=LS-Y, 2=RS-X, 3=RS-Y, 4=L2-analog, 5=R2-analog
            const STICK_SCALE = 8; // max px displacement for stick knobs

            /* ═══════════════════════════════════════
       Keyboard → button mapping
       ═══════════════════════════════════════ */
            const KEY_MAP = {
                KeyQ: "L1",
                KeyE: "R1",
                KeyW: "D-Up",
                KeyA: "D-Left",
                KeyS: "D-Down",
                KeyD: "D-Right",
                KeyI: "△",
                KeyJ: "□",
                KeyK: "✕",
                KeyL: "◯",
                ArrowUp: "LS↑",
                ArrowDown: "LS↓",
                ArrowLeft: "LS←",
                ArrowRight: "LS→",
                ShiftLeft: "L3",
                ShiftRight: "R3",
                Digit1: "L2",
                Digit2: "R2",
                Backspace: "Create",
                Enter: "Options",
                Space: "PS",
            };

            /* ═══════════════════════════════════════
       State
       ═══════════════════════════════════════ */
            const activeButtons = new Set();
            let gamepadConnected = false;
            let gamepadIndex = -1;

            /* ═══════════════════════════════════════
       DOM refs
       ═══════════════════════════════════════ */
            const statusDot = document.getElementById("status-dot");
            const statusText = document.getElementById("status-text");
            const ctrlName = document.getElementById("controller-name");
            const pressLog = document.getElementById("press-log");
            const lsKnob = document.getElementById("LS_KNOB");
            const rsKnob = document.getElementById("RS_KNOB");
            const triggerL2 = document.getElementById("trigger-l2");
            const triggerR2 = document.getElementById("trigger-r2");
            const touchpad = document.getElementById("TOUCHPAD");

            /* ═══════════════════════════════════════
       Gamepad lifecycle
       ═══════════════════════════════════════ */
            window.addEventListener("gamepadconnected", (e) => {
                gamepadConnected = true;
                gamepadIndex = e.gamepad.index;
                statusDot.classList.add("connected");
                statusText.textContent = "Controller connected";
                ctrlName.textContent = e.gamepad.id;
                if (touchpad) touchpad.classList.add("connected");
            });

            window.addEventListener("gamepaddisconnected", () => {
                gamepadConnected = false;
                gamepadIndex = -1;
                statusDot.classList.remove("connected");
                statusText.textContent = "Controller disconnected";
                ctrlName.textContent = "";
                if (touchpad) touchpad.classList.remove("connected");
                clearAllButtons();
            });

            /* ═══════════════════════════════════════
       SVG click / touch handlers (tap the pad!)
       ═══════════════════════════════════════ */
            document.querySelectorAll("#pad-svg g[data-btn]").forEach((g) => {
                g.style.cursor = "pointer";
                const token = g.dataset.btn;
                g.addEventListener("mousedown", (e) => {
                    e.preventDefault();
                    pressButton(token);
                });
                g.addEventListener("mouseup", () => releaseButton(token));
                g.addEventListener("mouseleave", () => releaseButton(token));
                g.addEventListener("touchstart", (e) => {
                    e.preventDefault();
                    pressButton(token);
                });
                g.addEventListener("touchend", () => releaseButton(token));
            });

            /* ═══════════════════════════════════════
       Press / release a button by token
       ═══════════════════════════════════════ */
            function pressButton(token) {
                if (activeButtons.has(token)) return;
                activeButtons.add(token);

                // Highlight SVG group
                const g = document.querySelector(
                    `#pad-svg g[data-btn="${CSS.escape(token)}"]`,
                );
                if (g) g.classList.add("pressed");

                if (token === "L2") setTriggerIndicator("L2", true);
                if (token === "R2") setTriggerIndicator("R2", true);

                // Update press log
                updatePressLog();
            }

            function releaseButton(token) {
                activeButtons.delete(token);

                const g = document.querySelector(
                    `#pad-svg g[data-btn="${CSS.escape(token)}"]`,
                );
                if (g) g.classList.remove("pressed", "active-trigger");

                if (token === "L2") setTriggerIndicator("L2", false);
                if (token === "R2") setTriggerIndicator("R2", false);

                updatePressLog();
            }

            function clearAllButtons() {
                activeButtons.clear();
                document
                    .querySelectorAll("#pad-svg g[data-btn]")
                    .forEach((g) => {
                        g.classList.remove("pressed", "active-trigger");
                    });
                updatePressLog();
                // Reset trigger indicators
                [triggerL2, triggerR2].forEach((ind) => {
                    if (!ind) return;
                    ind.classList.remove("active");
                });
                // Reset sticks
                if (lsKnob) lsKnob.style.transform = "";
                if (rsKnob) rsKnob.style.transform = "";
            }

            function updatePressLog() {
                if (activeButtons.size === 0) {
                    pressLog.innerHTML =
                        '<span style="color:#444;font-size:0.8rem;">Press buttons on the controller or keyboard...</span>';
                    return;
                }
                pressLog.innerHTML = [...activeButtons]
                    .map((t) => `<span class="press-tag">${t}</span>`)
                    .join("");
            }

            /* ═══════════════════════════════════════
       Trigger indicator light-up
       ═══════════════════════════════════════ */
            function setTriggerIndicator(side, pressed) {
                const indicator = side === "L2" ? triggerL2 : triggerR2;
                if (!indicator) return;
                if (pressed) {
                    indicator.classList.add("active");
                } else {
                    indicator.classList.remove("active");
                }
            }

            /* ═══════════════════════════════════════
       Stick visualization
       ═══════════════════════════════════════ */
            function setStick(knob, x, y) {
                if (!knob) return;
                // Clamp to deadzone
                const dead = 0.15;
                const dx = Math.abs(x) < dead ? 0 : x;
                const dy = Math.abs(y) < dead ? 0 : y;
                knob.style.transform = `translate(${dx * STICK_SCALE}px, ${dy * STICK_SCALE}px)`;
            }

            /* ═══════════════════════════════════════
       Gamepad polling loop
       ═══════════════════════════════════════ */
            function pollGamepad() {
                if (!gamepadConnected) return;

                const gamepads = navigator.getGamepads();
                const gp = gamepads[gamepadIndex];
                if (!gp) return;

                // ── Digital buttons ──
                for (const [index, token] of Object.entries(GAMEPAD_MAP)) {
                    const btn = gp.buttons[parseInt(index)];
                    if (btn && btn.pressed) {
                        pressButton(token);
                    } else {
                        releaseButton(token);
                    }
                }

                // ── Sticks ──
                setStick(lsKnob, gp.axes[0], gp.axes[1]);
                setStick(rsKnob, gp.axes[2], gp.axes[3]);

                // ── Lightbar ──
                const lightbar = document.getElementById("LIGHTBAR");
                if (lightbar) {
                    lightbar.setAttribute("fill", "rgba(0,100,255,0.6)");
                }
            }

            /* ═══════════════════════════════════════
       Keyboard handlers
       ═══════════════════════════════════════ */
            const kbState = new Set();

            document.addEventListener("keydown", (e) => {
                const token = KEY_MAP[e.code];
                if (!token) return;
                if (kbState.has(e.code)) return; // ignore key repeat
                kbState.add(e.code);
                e.preventDefault();
                pressButton(token);

                // Simulate stick movement for arrow keys
                if (e.code === "ArrowUp") setStick(lsKnob, 0, -1);
                if (e.code === "ArrowDown") setStick(lsKnob, 0, 1);
                if (e.code === "ArrowLeft") setStick(lsKnob, -1, 0);
                if (e.code === "ArrowRight") setStick(lsKnob, 1, 0);
            });

            document.addEventListener("keyup", (e) => {
                const token = KEY_MAP[e.code];
                if (!token) return;
                kbState.delete(e.code);
                releaseButton(token);

                if (
                    [
                        "ArrowUp",
                        "ArrowDown",
                        "ArrowLeft",
                        "ArrowRight",
                    ].includes(e.code)
                ) {
                    setStick(lsKnob, 0, 0);
                }
            });

            /* ═══════════════════════════════════════
       Combined loop
       ═══════════════════════════════════════ */
            function loop() {
                pollGamepad();
                requestAnimationFrame(loop);
            }

            requestAnimationFrame(loop);
        </script>
